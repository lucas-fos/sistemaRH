<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-xl shadow-lg">

  <h2 class="text-2xl font-bold text-center text-blue-900 mb-6">
    Login - Sistema RH
  </h2>

  <form [formGroup]="form" (ngSubmit)="entrar()">

    <div class="mb-4">
      <label class="block mb-2 font-semibold">E-mail</label>

      <input
        type="email"
        formControlName="email"
        placeholder="Digite seu e-mail"
        class="w-full border rounded-lg p-3"
      />

      @if (form.controls.email.touched && form.controls.email.invalid) {
        <p class="text-red-600 text-sm mt-1">
          Informe um e-mail válido.
        </p>
      }
    </div>

    <div class="mb-4">
      <label class="block mb-2 font-semibold">Senha</label>

      <input
        type="password"
        formControlName="senha"
        placeholder="Digite sua senha"
        class="w-full border rounded-lg p-3"
      />

      @if (form.controls.senha.touched && form.controls.senha.invalid) {
        <p class="text-red-600 text-sm mt-1">
          A senha é obrigatória.
        </p>
      }
    </div>

    @if (erro()) {
      <p class="text-red-600 text-center mb-4">
        {{ erro() }}
      </p>
    }

    <button
      type="submit"
      [disabled]="carregando()"
      class="w-full bg-blue-900 text-white p-3 rounded-lg hover:bg-blue-800 disabled:opacity-50"
    >
      {{ carregando() ? 'Entrando...' : 'Entrar' }}
    </button>

  </form>

  <p class="text-center mt-5">
    Não tem uma conta?
    <a routerLink="/cadastro" class="text-blue-700 font-semibold">
      Cadastre-se
    </a>
  </p>

</div>
